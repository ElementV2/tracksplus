[package]
name = "tracksplus"
version = "0.7.1"
edition = "2024"
description = "Enregistreur multipiste et soundboard pour le live"

[dependencies]
anyhow = "1.0.105"
chrono = "0.4.45"
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
eframe = "0.37.0"
fs4 = "1.1.0"
hound = "3.5.1"
midir = "0.11.1"
# Formats lus : ceux qu'on accepte (WAV, AIFF, MP3, AAC/M4A, FLAC, Ogg, CAF). Pas de
# Matroska/WebM : jamais proposé, et autant de surface en moins pour un fichier piégé.
symphonia = { version = "0.5.5", default-features = false, features = ["all-codecs", "aiff", "caf", "isomp4", "ogg", "wav"] }
parking_lot = "0.13.0"
rfd = "0.18.0"
rtrb = "0.4.1"
rubato = "0.16"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Vérification des installeurs téléchargés (empreinte publiée par GitHub).
sha2 = "0.10"
# Signature des versions publiées (src/release_sig.rs).
ed25519-dalek = "2.2"
keepawake = "0.6.1"
# Export : FLAC (pur Rust), MP3 (LAME, LGPL), Ogg Vorbis (libvorbis), mesure EBU R128.
flacenc = { version = "0.5.1", default-features = false }
mp3lame-encoder = "0.3.0"
vorbis_rs = { version = "0.5.6", default-features = false }
ebur128 = "0.1.11"
id3 = { version = "1.17.4", default-features = false }

# Une seule instance : ramener au premier plan la fenêtre déjà ouverte.
[target.'cfg(windows)'.dependencies]
# WASAPI : thread audio en priorité « Pro Audio » (MMCSS), comme les logiciels pro.
# Sans cette option, cpal laisse le callback en priorité normale (risque de décrochages
# dès que l'interface ou l'antivirus travaillent).
cpal = { version = "0.18.2", features = ["realtime"] }
# Arrêt de Windows bloqué pendant une prise (shutdown.rs) ; décodage isolé (src/isolate.rs) :
# processus fils limité en mémoire (Job Object), sans fenêtre d'erreur s'il s'arrête.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Shutdown", "Win32_System_JobObjects", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug", "Win32_System_Registry"] }
# Fenêtre principale (HWND) : arrêt de Windows bloqué pendant une prise (voir shutdown.rs).
raw-window-handle = "0.6.2"

[dev-dependencies]
# Tests : aucune allocation dans les callbacks audio (règle n°1 du temps réel).
assert_no_alloc = "1.1"
# Génération de la clé de signature (examples/sign_release.rs).
getrandom = "0.4"

[build-dependencies]
# Icône et informations de version intégrées à l'exécutable Windows.
winresource = "0.1"

[features]
default = []
# Pilotes ASIO sous Windows (Dante Virtual Soundcard, RME, Focusrite…).
asio = ["cpal/asio"]
# Serveur JACK (Linux/macOS).
jack = ["cpal/jack"]

[profile.release]
opt-level = 3
lto = "thin"
# Noms de fonctions gardés : les traces de crash.log restent lisibles.
strip = "debuginfo"

# Copie locale de asio-sys : permet la compilation croisée Windows (MinGW) avec ASIO.
# Modifications marquées « TracksPlus » : vendor/asio-sys/build.rs (compilation MinGW) et
# src/bindings/mod.rs (pilote qui refuse de démarrer toujours relâché).
[patch.crates-io]
asio-sys = { path = "vendor/asio-sys" }
