name: Build

# Lancement manuel uniquement (onglet Actions → Build → Run workflow) :
# les builds sont faits localement, sans consommer de minutes GitHub.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Le script de asio-sys sait télécharger le SDK Steinberg, mais sa décompression
      # PowerShell (Expand-Archive) plante sur les runners actuels. On le fournit nous-mêmes
      # via CPAL_ASIO_DIR, ce qui court-circuite ce téléchargement. Version épinglée et
      # vérifiée par son empreinte (mêmes valeurs que scripts/package-windows.ps1) : ses
      # sources sont compilées dans l'exécutable distribué.
      - name: SDK ASIO
        shell: bash
        run: |
          curl -fsSL --retry 3 --proto '=https' -o asio_sdk.zip https://download.steinberg.net/sdk_downloads/ASIO-SDK_2.3.4_2025-10-15.zip
          echo "d5ebf0c20dd2c5f43771fd0c1418f4b361bf52434ee670097cfa6b3a335e2eca  asio_sdk.zip" | sha256sum -c -
          unzip -q -o asio_sdk.zip -d asio_sdk
          header=$(find "$PWD/asio_sdk" -name asiodrivers.h | head -n 1)
          test -n "$header" || { echo "asiodrivers.h introuvable dans le SDK"; exit 1; }
          root=$(dirname "$(dirname "$header")")
          ls "$root"
          echo "CPAL_ASIO_DIR=$(cygpath -w "$root")" >> "$GITHUB_ENV"
      - name: Build (ASIO + WASAPI)
        run: cargo build --release --features asio
      - uses: actions/upload-artifact@v4
        # Un quota de stockage plein ne doit pas faire échouer la compilation.
        continue-on-error: true
        with:
          name: TracksPlus-windows
          path: target/release/tracksplus.exe
          retention-days: 5

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build universel
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output tracksplus \
            target/aarch64-apple-darwin/release/tracksplus \
            target/x86_64-apple-darwin/release/tracksplus
      - name: Bundle .app
        run: |
          APP=TracksPlus.app
          mkdir -p $APP/Contents/MacOS
          cp tracksplus $APP/Contents/MacOS/TracksPlus
          cp packaging/macos/Info.plist $APP/Contents/Info.plist
          codesign --force --deep -s - $APP
          ditto -c -k --keepParent $APP TracksPlus-macos.zip
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: TracksPlus-macos
          path: TracksPlus-macos.zip
          retention-days: 5
